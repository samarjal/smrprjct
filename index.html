<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>smrprjct</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .image-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    .content {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .message {
      max-width: 520px;
      width: 100%;
      text-align: left;
    }

    h1 {
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 6px;
    }

    .sub {
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>

<body>

  <img
    class="image-bg"
    src="bg-img.gif"
    alt=""
  />

  <div class="overlay"></div>

  <main class="content">
    <div class="message">
      <h1>hi, i'm busy rendering animations rn.</h1>

      <!-- <p>
        currently fighting keyframes, deadlines, and questionable life choices.
      </p> -->

      <!-- <p>thanks for checking tho :))</p> -->

      <p class="sub">be back soon. ty :))</p>
    </div>
  </main>

</body>
</html>
